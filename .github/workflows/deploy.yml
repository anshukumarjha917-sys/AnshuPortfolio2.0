name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React + Vite portfolio
      - name: Build portfolio
        run: npm run build

      # 5. Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          

      # 6. Upload built files to EC2
      - name: Upload portfolio to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          tar -czf portfolio.tar.gz -C dist .

          scp -i ~/.ssh/ec2_key \
            portfolio.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/portfolio.tar.gz"

      # 7. Deploy files to Nginx web directory
      - name: Deploy to Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            sudo mkdir -p /usr/share/nginx/html

            sudo tar -xzf /tmp/portfolio.tar.gz \
              -C /usr/share/nginx/html

            sudo rm -f /tmp/portfolio.tar.gz

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Portfolio deployed successfully!"
          EOF

      # 8. Clean up SSH key
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key
          rm -f portfolio.tar.gz
