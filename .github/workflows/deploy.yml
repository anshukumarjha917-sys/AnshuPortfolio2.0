name: Build and Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build React/Vite portfolio
      - name: Build portfolio
        run: npm run build

      - name: Configure SSH
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$EC2_SSH_KEY_B64" ]; then
            echo "ERROR: Base64 secret is missing"
            exit 1
          fi

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing"
            exit 1
          fi

          printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_key

          # Normalize Windows line endings
          tr -d '\r' < ~/.ssh/ec2_key > ~/.ssh/ec2_key_clean
          mv ~/.ssh/ec2_key_clean ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "Decoded key file size:"
          wc -c < ~/.ssh/ec2_key

          echo "Key file header:"
          head -n 1 ~/.ssh/ec2_key

          echo "Validating SSH private key..."

          if ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null 2>/tmp/ssh_error.txt; then
            echo "SUCCESS: SSH private key is valid"
          else
            echo "ERROR: SSH key validation failed"
            cat /tmp/ssh_error.txt
            exit 1
          fi

          echo "Checking EC2 host..."
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
      # Step 6: Package the built website
      - name: Package portfolio
        run: |
          tar -czf portfolio.tar.gz -C dist .

      # Step 7: Upload website files to EC2
      - name: Upload portfolio to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            portfolio.tar.gz \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/portfolio.tar.gz"

      # Step 8: Deploy files to Nginx
      - name: Deploy to Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'set -eu
             sudo mkdir -p /usr/share/nginx/html
             sudo tar -xzf /home/ec2-user/portfolio.tar.gz -C /usr/share/nginx/html
             sudo rm -f /home/ec2-user/portfolio.tar.gz
             sudo nginx -t
             sudo systemctl reload nginx
             echo "Portfolio deployed successfully!"'

      # Step 9: Remove temporary SSH key
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key
